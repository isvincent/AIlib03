<title>資訊變便宜，理解變貴</title>
<style>
:root{color-scheme:light;--ink:#1c2550;--muted:#4a5175;--line:#e4e2f0;--accent:#7357ff;--err:#c8321f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:16px;background:linear-gradient(135deg,#fff3c9,#ffe3ef 45%,#dff0ff);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:18px}
form{width:100%;max-width:420px;padding:30px 28px;background:#fff;border-radius:22px;box-shadow:0 16px 40px rgba(40,40,110,.16)}
.books{display:flex;align-items:flex-end;gap:5px;height:76px;margin-bottom:16px}
.books i{flex:1;border-radius:5px 5px 2px 2px;transform-origin:bottom;animation:sway 3.4s ease-in-out infinite}
.books i:nth-child(2n){animation-delay:.4s}.books i:nth-child(3n){animation-delay:.9s}
@keyframes sway{50%{transform:scaleY(.86)}}
@media (prefers-reduced-motion:reduce){.books i{animation:none}}
h1{margin:0 0 6px;font-size:1.6rem;line-height:1.35}
p{margin:0 0 18px;color:var(--muted);line-height:1.6}
label{display:block;margin-bottom:6px;font-weight:700}
input{width:100%;padding:12px 14px;font:inherit;color:inherit;background:#fff;border:2px solid var(--line);border-radius:12px}
input:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{width:100%;margin-top:14px;padding:12px;font:inherit;font-weight:700;color:#fff;background:var(--accent);border:0;border-radius:12px;cursor:pointer;transition:.15s}
button:hover{background:#5f45e6}
button:disabled{opacity:.6;cursor:progress}
#msg{min-height:1.6em;margin:10px 0 0;color:var(--err);font-weight:700}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-9px)}50%{transform:translateX(9px)}75%{transform:translateX(-5px)}}
</style>
</head>
